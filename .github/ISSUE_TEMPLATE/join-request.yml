name: 申请加入组织
description: 填写 GitHub ID 和申请理由，管理员审批后自动邀请（角色 member）
title: "[加入申请] "
labels: ["join-request"]
body:
  - type: input
    id: github_id
    attributes:
      label: GitHub ID
      description: 你的 GitHub 用户名（必须与提交 Issue 的账号一致）
      placeholder: octocat
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 申请理由
      description: 你计划参与或迁移的项目、你的角色，便于管理员审批
      placeholder: 我维护 xxx 插件，计划迁移到组织……
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已阅读并同意社区治理规则与行为准则
          required: true
