name: 申请加入组织
description: 填写 GitHub ID 和申请理由，管理员审批后自动邀请（角色 member）
title: "[加入申请] "
labels: ["join-request"]
body:
  - type: markdown
    attributes:
      value: |
        **申请前请先阅读：**

        - [社区治理规则](https://github.com/omdsh-dev/community/blob/main/GOVERNANCE.zh-CN.md)
        - [行为准则](https://github.com/omdsh-dev/community/blob/main/CODE_OF_CONDUCT.zh-CN.md)
        - [参与指南](https://github.com/omdsh-dev/community/blob/main/onboarding/README.zh-CN.md)

        行为准则要点：尊重所有参与者；禁止骚扰、歧视、威胁、人肉搜索、持续扰乱和权限滥用。CoC 事件请通过保密渠道报告，**不要**开公开 Issue。
  - type: input
    id: github_id
    attributes:
      label: GitHub ID
      description: 你的 GitHub 用户名（必须与提交 Issue 的账号一致）
      placeholder: octocat
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 申请理由
      description: 你计划参与或迁移的项目、你的角色，便于管理员审批
      placeholder: 我维护 xxx 插件，计划迁移到组织……
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已阅读并同意上述治理规则与行为准则
          required: true
